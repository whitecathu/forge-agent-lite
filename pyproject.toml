[project]
name = "forge-agent-lite"
version = "0.1.0"
description = "A small, auditable coding agent with isolated verification"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "pydantic-settings>=2.8,<3", "langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3,<4", "typer>=0.15,<1"]

[project.scripts]
forge = "forge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forge"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".data", "web/node_modules", "web/dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
