name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.18"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run python -m evals.run
      - run: docker build -t forge-runner:local runner
      - run: uv run pytest -q tests/test_docker.py
        env:
          FORGE_DOCKER_TESTS: "1"
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t forge-agent-lite:ci .
      - run: docker run -d --name forge-smoke -p 127.0.0.1:18001:8001 forge-agent-lite:ci
      - run: curl --fail --retry 15 --retry-connrefused --retry-delay 2 http://127.0.0.1:18001/api/health
      - run: curl --fail http://127.0.0.1:18001/ | grep 'script type="module"'
      - run: curl --fail -X POST http://127.0.0.1:18001/api/demo-repository
      - if: always()
        run: docker logs forge-smoke; docker rm -f forge-smoke
